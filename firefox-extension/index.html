<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackwing</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="cards.css">
</head>

<body>
    <header>
        <img class="logo" src="assets/logo.png">
        <p><strong>Blackwing</strong> (c) 2026 silver_gray</p>
        <a id="settings" href="settings.html">⚙</a>
    </header>
    <main>
        <section>
            <p>Live Followed Channels</p>

            <div class="channels" id="followed-channels"></div>
        </section>

        <section>
            <p>Recommended Channels</p>
            <div class="channels" id="recommended-channels">
                <div class="stream-card">
                    <div class="preview-image"><img
                            src="https://static-cdn.jtvnw.net/previews-ttv/live_user_alleyrosettv-558x330.jpg"></div>
                    <div class="profile-image"><img
                            src="https://static-cdn.jtvnw.net/jtv_user_pictures/11e6fc82-91c0-4ebf-b8da-e64c090ea8d4-profile_image-50x50.jpeg">
                    </div>
                    <div class="title">SPOOPY SZN XVIII | back to our regularly scheduled programming | Creator Push
                    </div>
                    <div class="username">AlleyRoseTTV</div>
                    <div class="category">Dead by Daylight</div>
                    <div class="tags">
                        <div class="tag">TransCreator</div>
                        <div class="tag">HorrorAndChill</div>
                        <div class="tag">dbdcreatorpush</div>
                        <div class="tag">SheHerTheyThem</div>
                        <div class="tag">English</div>
                        <div class="tag">DropsEnabled</div>
                    </div><a class="open">Open Stream</a>
                </div>
            </div>

            <button id="load-more" hidden>Load more</button>
        </section>

    </main>
    <script type="module" src="index.js"></script>
</body>

</html>
