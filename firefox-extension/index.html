<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackwing</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <img class="logo" src="icons/icon.png">
        <p><strong>Blackwing</strong> (c) 2026 silver_gray</p>
        <button id="settings-button">⚙</button>
    </header>
    <main>
        <section id="settings-page" hidden>
            <div class="field">
                <label>Search Categories</label>
                <input id="categories" placeholder="just chatting, music, irl, etc …">
            </div>

            <div class="field">
                <label>Filter Tags</label>
                <input id="filter_tags" placeholder="(english or japanese) and vtuber">
            </div>

            <div class="field">
                <label>Blocked Keywords</label>
                <input id="bad_keywords" placeholder="nsfw, 18, onlyfans, etc...">
            </div>

            <div class="row">
                <div class="field">
                    <label>Max Viewers</label>
                    <input id="max_viewers" placeholder="Max Viewers">
                </div>
                <div class="field">
                    <label>Max Followers</label>
                    <input id="max_followers" placeholder="Max Followers">
                </div>
            </div>
        </section>

        <section id="front-page">
            <p>Live Followed Channels</p>
            <div id="live-followed-channels"></div>

            <div id="test"></div>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
