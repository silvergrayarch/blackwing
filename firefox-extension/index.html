<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackwing</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <img class="logo" src="icons/icon.png">
        <p><strong>Blackwing</strong> (c) 2026 silver_gray</p>
        <button id="settings-button">⚙</button>
    </header>
    <main>
        <section id="settings-page" hidden>
            <div class="field">
                <label>Followed Categories</label>
                <input id="followed-categories" placeholder="just chatting, music, irl, etc …">
            </div>

            <div class="field">
                <label>Filter Tags</label>
                <input id="filter-tags" placeholder="(english or japanese) and vtuber">
            </div>

            <div class="field">
                <label>Blocked Description Keywords</label>
                <input id="bad-description-keywords" placeholder="nsfw, gambling, etc...">
            </div>

            <div class="field">
                <label>Blocked Pannel Keywords</label>
                <input id="bad-pannel-keywords" placeholder="nsfw, gambling, etc...">
            </div>

            <div class="field">
                <label>Blocked Rule Keywords</label>
                <input id="bad-chat-rule-keywords" placeholder="nsfw, gambling, etc...">
            </div>

            <div class="row">
                <div class="field">
                    <label>Max Viewers</label>
                    <input id="max-viewers" placeholder="max viewers">
                </div>
                <div class="field">
                    <label>Max Followers</label>
                    <input id="max-followers" placeholder="max followers">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Minimum Viewers</label>
                    <input id="min-viewers" placeholder="minimum viewers">
                </div>
                <div class="field">
                    <label>Minimum Followers</label>
                    <input id="min-followers" placeholder="minimum followers">
                </div>
            </div>
        </section>

        <section id="front-page">
            <p class="segment-title">Live Followed Channels</p>
            <div id="live-followed-channels"></div>

            <p class="segment-title">Recommended Channels</p>
            <div id="recommended-channels"></div>

            <div id="test"></div>
        </section>
    </main>

    <script src="index.js"></script>
</body>

</html>
