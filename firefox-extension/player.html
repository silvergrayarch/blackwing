<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackwing</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="player.css">
</head>

<body>
    <header>
        <a href="index.html"><img id="logo" src="assets/logo.png"></a>
        <p><strong>Blackwing</strong> (c) 2026 silver_gray</p>
        <a id="settings" href="settings.html">⚙</a>
    </header>
    <main>

        <video id="video-player" controls controlslist="play volume fullscreen"></video>

        <div id="chat-messages">
            <div class="chat-message">
                <header>
                    <img src="https://static-cdn.jtvnw.net/jtv_user_pictures/99a1ec8d-530c-4cc9-8267-034cb17cb575-profile_image-70x70.png"
                        class="chat-profile-image">
                    <span>${display_name}: </span>
                </header>
                <p>${message}</p>
            </div>
        </div>

        <footer>
            <input id="chat-input">
            <button id="send-button">➩</button>
        </footer>
    </main>

    <script src="assets/hls.min.js"></script>
    <script type="module" src="player.js"></script>
</body>

</html>
