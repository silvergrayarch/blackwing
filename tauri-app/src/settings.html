<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Blackwing</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="settings.css">
</head>

<body>
    <header>
        <img class="logo" src="assets/logo.png">
        <p><strong>Blackwing</strong> (c) 2026 silver_gray</p>
        <a id="settings" href="index.html">⚙</a>
    </header>
    <main>
        <div class="field">
            <label>Filter Tags</label>
            <input id="filter-tags" placeholder="(english or japanese) and vtuber">
        </div>

        <div class="field">
            <label>Blocked Tags</label>
            <input id="bad-tags" placeholder="(gambling or casino) and crypto">
        </div>

        <div class="field">
            <label>Blocked Title Keywords</label>
            <input id="bad-title-keywords" placeholder="nsfw, gambling, etc...">
        </div>

        <div class="field">
            <label>Blocked Description Keywords</label>
            <input id="bad-description-keywords" placeholder="nsfw, gambling, etc...">
        </div>

        <div class="field">
            <label>Blocked Pannel Keywords</label>
            <input id="bad-pannel-keywords" placeholder="nsfw, gambling, etc...">
        </div>

        <div class="field">
            <label>Blocked Rule Keywords</label>
            <input id="bad-rule-keywords" placeholder="nsfw, gambling, etc...">
        </div>

        <div class="row">
            <div class="field">
                <label>Max Viewers</label>
                <input id="max-viewers" placeholder="max viewers">
            </div>
            <div class="field">
                <label>Max Followers</label>
                <input id="max-followers" placeholder="max followers">
            </div>
        </div>

        <div class="row">
            <div class="field">
                <label>Minimum Viewers</label>
                <input id="min-viewers" placeholder="minimum viewers">
            </div>
            <div class="field">
                <label>Minimum Followers</label>
                <input id="min-followers" placeholder="minimum followers">
            </div>
        </div>

    </main>
    <script type="module" src="settings.js"></script>
</body>

</html>
